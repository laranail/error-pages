name: assets

on:
  pull_request:
    branches: [main]
    paths: ['presets/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: error-pages-ui (Vue/React)
    defaults:
      run:
        working-directory: presets

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: presets/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (scss → css)
        run: npm run build:css

      - name: Verify the committed CSS is up to date
        run: git diff --exit-code shared/css/critical.css

      - name: Check WCAG AA contrast
        run: npm run check:contrast

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run component tests
        run: npm test
