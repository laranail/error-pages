name: assets

on:
  push:
    branches: [main]
    paths: ['presets/**']
  pull_request:
    branches: [main]
    paths: ['presets/**']

jobs:
  ui:
    runs-on: ubuntu-latest
    name: error-pages-ui (Vue/React)
    defaults:
      run:
        working-directory: presets

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: presets/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (scss → css)
        run: npm run build:css

      - name: Verify the committed CSS is up to date
        run: git diff --exit-code shared/css/critical.css

      - name: Check WCAG AA contrast
        run: npm run check:contrast

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run component tests
        run: npm test
